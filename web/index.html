<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Verified Local Services in Pakistan">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="KaamHub">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>KaamHub - Local Services Pakistan</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #0F5132; /* Deep Forest Green */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      overflow: hidden;
      user-select: none;
    }

    #loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(180deg, #0F5132 0%, #0A3622 100%);
      z-index: 99999;
      transition: opacity 0.4s ease-out;
      pointer-events: none;
    }

    .loader-wrapper {
      position: relative;
      width: 170px;
      height: 170px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Layer 1: Outer Circular Ring */
    .ring-outer {
      position: absolute;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: 3.5px solid transparent;
      border-top-color: #ffffff;
      border-right-color: rgba(255, 255, 255, 0.45);
      animation: spin-clockwise 2.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    /* Layer 2: Middle Circular Ring */
    .ring-middle {
      position: absolute;
      width: 125px;
      height: 125px;
      border-radius: 50%;
      border: 3px solid transparent;
      border-top-color: #D97706; /* Amber Gold */
      border-left-color: #F59E0B;
      animation: spin-counter 1.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    /* Layer 3: Inner Circular Ring */
    .ring-inner {
      position: absolute;
      width: 95px;
      height: 95px;
      border-radius: 50%;
      border: 2.5px solid transparent;
      border-bottom-color: #198754; /* Emerald Light */
      border-right-color: #198754;
      animation: spin-clockwise 1.1s linear infinite;
    }

    /* Center Circular Logo */
    .center-logo {
      width: 66px;
      height: 66px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
      border: 2px solid #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      z-index: 2;
    }

    .center-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    @keyframes spin-clockwise {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes spin-counter {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-360deg); }
    }

    .loading-text {
      margin-top: 28px;
      color: #ffffff;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-align: center;
    }

    .loading-subtext {
      margin-top: 6px;
      color: rgba(255, 255, 255, 0.75);
      font-size: 13px;
      font-weight: 500;
      text-align: center;
    }
  </style>
</head>
<body>
  <!-- 3-Layer Concentric Circular Rotating Preloader -->
  <div id="loading-container">
    <div class="loader-wrapper">
      <div class="ring-outer"></div>
      <div class="ring-middle"></div>
      <div class="ring-inner"></div>
      <div class="center-logo">
        <img src="icons/Icon-192.png" alt="KaamHub Circular Logo">
      </div>
    </div>
    <div class="loading-text">KaamHub • کام ہب</div>
    <div class="loading-subtext">لوڈ ہو رہا ہے... براہِ کرم انتظار فرمائیں</div>
  </div>

  <script>
    // Smoothly remove preloader as soon as Flutter attaches to the DOM
    function hidePreloader() {
      const loader = document.getElementById('loading-container');
      if (loader && loader.style.opacity !== '0') {
        loader.style.opacity = '0';
        setTimeout(function() {
          if (loader.parentNode) loader.parentNode.removeChild(loader);
        }, 400);
      }
    }

    const observer = new MutationObserver(function(mutations) {
      if (document.querySelector('flutter-view') || document.querySelector('flt-glass-pane')) {
        hidePreloader();
        observer.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // Fallback: Max 3.5s timeout ensures loader never hangs
    setTimeout(hidePreloader, 3500);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
